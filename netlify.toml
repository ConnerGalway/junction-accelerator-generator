[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Exclude non-sensitive values from secrets scanning
  # SUPABASE_URL, GITHUB_OWNER, GITHUB_REPO are public values that appear in client code
  # GITHUB_TOKEN and SUPABASE_SERVICE_ROLE_KEY remain protected
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_OWNER,GITHUB_REPO,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

# Extend timeout for assessment generation (makes multiple API calls)
# Background functions get 15 minute timeout automatically
[functions."generate-assessment-background"]
  external_node_modules = ["@anthropic-ai/sdk"]

[functions."regenerate-assessment-background"]
  external_node_modules = ["@anthropic-ai/sdk"]

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP allows: self, Supabase, CDN scripts, Google Fonts, inline styles (required for design system)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.resend.com; frame-ancestors 'none'"

# Additional headers for admin pages
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Prevent CDN caching on client assessment pages (content updates frequently)
[[headers]]
  for = "/clients/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Also apply to the rewritten URLs (/:slug/ → /clients/:slug/)
[[headers]]
  for = "/:slug/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
